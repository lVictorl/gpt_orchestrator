[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gpt-orchestrator"
version = "1.1.0"
description = "Desktop AI prompt orchestration app (OpenAI, Anthropic, DeepSeek)"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "openai>=1.30",
    "anthropic>=0.28",
    "aiosqlite>=0.20",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "jinja2>=3.1",
    "structlog>=24.1",
    "tomli-w>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
]
package = [
    "pyinstaller>=6.5",
]

[project.scripts]
gpt-orchestrator     = "main:main"
gpt-orchestrator-cli = "cli.cli_main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
